name: Console validation

"on":
  push:
    branches: [main, 'feat/**', 'fix/**', 'test/**', 'ci/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Check distributable sources and history
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_public_history.py
          python3 -m unittest discover -s tests -p test_public_history.py
      - name: Check documentation and repository layout
        run: |
          python3 scripts/docs_languages.py --require-complete
          python3 -m unittest discover -s tests -p test_docs_languages.py
          python3 -m unittest discover -s tests -p test_repository_layout.py
          python3 -m unittest discover -s tests -p test_release_artifact_rehearsal.py
      - name: Check offline migration contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/rancho-migration"
          "$RUNNER_TEMP/rancho-migration/bin/python" -m pip install --disable-pip-version-check --no-input -r migration/requirements.txt
          "$RUNNER_TEMP/rancho-migration/bin/python" -B -m unittest discover -s migration
      - name: Check offline artifact inventory contracts
        run: python3 -B -m unittest discover -s tests -p test_artifact_inventory.py
      - name: Check backend configuration and OIDC contracts
        run: python3 scripts/check_backend_contracts.py
      - name: Install locked console dependencies
        working-directory: console
        run: npm ci
      - name: Check formatting
        working-directory: console
        run: npm run format:check
      - name: Check registered translation catalogs
        working-directory: console
        run: npm run check:locales
      - name: Run console component and contract tests
        working-directory: console
        run: npm test
      - name: Check TypeScript and build console
        working-directory: console
        run: npm run build
