name: Source release provenance

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and package tracked source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/check_repository.py
          python3 scripts/check_public_history.py
          python3 scripts/docs_languages.py --require-complete
          mkdir release-bundle
          archive="rancho-platform-${GITHUB_SHA}-source.zip"
          git archive --format=zip --prefix=rancho-platform/ --output="release-bundle/$archive" "$GITHUB_SHA"
          cd release-bundle
          sha256sum "$archive" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Attest the source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-bundle/*-source.zip

      - name: Retain the exact attested archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ github.sha }}
          path: release-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
