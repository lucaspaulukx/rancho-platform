services:
  rancho:
    environment:
      CATTLE_CATALOG_EXECUTE: "true"
      CATTLE_CATALOG_URL: library=file:///opt/rancho-catalog
      CATTLE_COMPOSE_EXECUTOR_EXECUTE: "true"
    volumes:
      - type: bind
        source: ${RANCHO_CATALOG_DIRECTORY:?Set the path to the prepared bare catalog}
        target: /opt/rancho-catalog
        read_only: true
