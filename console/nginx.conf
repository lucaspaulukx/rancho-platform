map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format console_safe '"$request_method $uri" $status $body_bytes_sent';
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    access_log /var/log/nginx/access.log console_safe;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/console-security.conf;
    location = / { return 302 /console/; }
    location = /console { return 302 /console/$is_args$args; }
    location = /login { return 302 /console/login$is_args$args; }
    location = /console/console-config.json {
        include /etc/nginx/snippets/console-security.conf;
        add_header Cache-Control no-store;
    }
    location /console/assets/ {
        include /etc/nginx/snippets/console-assets-root.conf;
        include /etc/nginx/snippets/console-security.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /console/ {
        include /etc/nginx/snippets/console-security.conf;
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control no-cache;
    }
    location ~ ^/(v1|v2-beta|v1-catalog|v1-webhooks|v1-auth|oidc|r)(/|$) {
        include /etc/nginx/snippets/console-security.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        proxy_pass http://rancher:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_redirect ~^/login(.*)$ /console/login$1;
    }
    location / { return 404; }
}
