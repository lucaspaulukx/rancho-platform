map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map "$http_origin|$http_host" $foreign_api_origin {
    default 1;
    ~^\| 0;
    ~*^https?://([^/|]+)\|\1$ 0;
}
map $http_sec_fetch_site $foreign_api_site {
    default 0;
    cross-site 1;
    same-site 1;
}
map $uri $cookie_api_route {
    default 0;
    ~^/(v1|v2-beta|v1-catalog|v1-webhooks|v1-auth|r)(/|$) 1;
}
map $cookie_token $has_api_session {
    default 1;
    '' 0;
}
# Origin/Fetch Metadata protect cookie-authenticated API requests, including
# legacy _method overrides. OIDC redirects have their own state validation.
map "$cookie_api_route$has_api_session$foreign_api_origin$foreign_api_site" $reject_cookie_api_request {
    default 0;
    1101 1;
    1110 1;
    1111 1;
}
log_format console_safe '"$request_method $uri" $status $body_bytes_sent';
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    access_log /var/log/nginx/access.log console_safe;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/console-security.conf;
    location = / { return 302 /console/; }
    location = /console { return 302 /console/$is_args$args; }
    location = /login { return 302 /console/login$is_args$args; }
    location = /console/console-config.json {
        include /etc/nginx/snippets/console-security.conf;
        add_header Cache-Control no-store;
    }
    location /console/assets/ {
        include /etc/nginx/snippets/console-assets-root.conf;
        include /etc/nginx/snippets/console-security.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /console/ {
        include /etc/nginx/snippets/console-security.conf;
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control no-cache;
    }
    location ~ ^/(v1|v2-beta|v1-catalog|v1-webhooks|v1-auth|oidc|r)(/|$) {
        include /etc/nginx/snippets/console-security.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        if ($reject_cookie_api_request) { return 403; }
        proxy_pass http://rancher:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_redirect ~^/login(.*)$ /console/login$1;
    }
    location / { return 404; }
}
