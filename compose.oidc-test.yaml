services:
  rancher:
    environment:
      RANCHER_LAB_ALLOW_HTTP: "true"
      RANCHER_OIDC_ENABLED: "${RANCHER_OIDC_ENABLED:-true}"
      RANCHER_OIDC_ISSUER: http://localhost:18081/realms/rancher-lab
      RANCHER_OIDC_CLIENT_ID: rancher16
      RANCHER_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      RANCHER_OIDC_BACKCHANNEL: http://keycloak:8080/realms/rancher-lab
      RANCHER_OIDC_CALLBACK: ${RANCHER_OIDC_CALLBACK:-http://localhost:18080/oidc/callback}
    depends_on:
      - keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    container_name: rancher16-keycloak-lab
    command: ["start-dev", "--import-realm"]
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      LAB_USER_PASSWORD: ${LAB_USER_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: labadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:18081
      KC_DB_USERNAME: sa
      KC_DB_PASSWORD: password
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm.json:/opt/keycloak/data/import/rancher-lab-realm.json:ro
    mem_limit: 1g
volumes:
  keycloak-data:
